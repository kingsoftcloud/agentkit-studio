name: Qualify published Studio macOS installer

on:
  workflow_dispatch:
    inputs:
      studio_ref:
        description: Release source commit
        type: string
        required: true
      release_tag:
        description: Published Studio GitHub Release tag
        type: string
        required: true
      desktop_version:
        description: Installed desktop version
        type: string
        required: true
      mac_sha256:
        description: Disk image digest from signed macOS CI acceptance
        type: string
        required: true

permissions:
  contents: read

jobs:
  published-macos:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.studio_ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Download, verify and install the published macOS disk image
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.studio_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_VERSION: ${{ inputs.desktop_version }}
          DMG_SHA256: ${{ inputs.mac_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$RELEASE_TAG" =~ ^(desktop-)?v?[0-9][A-Za-z0-9.-]+$ && "$DMG_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          install_root="$RUNNER_TEMP/published-studio"
          mkdir -p "$install_root/files" "$install_root/mount" .artifacts/macos-proof
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-mac-arm64.dmg' --dir "$install_root/files"
          dmg=$(find "$install_root/files" -type f -name '*.dmg' -print)
          printf '%s  %s\n' "$DMG_SHA256" "$dmg" | shasum -a 256 -c
          hdiutil attach -readonly -nobrowse -mountpoint "$install_root/mount" "$dmg"
          trap 'hdiutil detach "$install_root/mount"' EXIT
          app="$install_root/AgentKit Studio.app"
          ditto "$install_root/mount/AgentKit Studio.app" "$app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$BUILD_VERSION"
          printf 'STUDIO_INSTALLED_APP=%s\n' "$app" >> "$GITHUB_ENV"
          jq -n --arg tag "$RELEASE_TAG" --arg source "$SOURCE_SHA" --arg version "$BUILD_VERSION" --arg sha256 "$DMG_SHA256" '{releaseTag:$tag,sourceCommit:$source,version:$version,installerSha256:$sha256,installed:true,signatureVerified:true,notarizationVerified:true}' > .artifacts/macos-proof/macos-install.json
      - name: Upgrade in plugin UI, restart original conversation and roll back
        env:
          AGENTKIT_TELEMETRY_DISABLED: '1'
        run: node scripts/verify-desktop-harness-upgrade.mjs "$STUDIO_INSTALLED_APP" 0.0.31 0.0.32 .artifacts/macos-proof/harness-upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-macos-acceptance
          path: .artifacts/macos-proof/
          if-no-files-found: error
