name: Verify signed Star Harness plugin upgrade and restart
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin-restart:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - run: pnpm install --frozen-lockfile
      - name: Install and verify the public signed Studio build
        shell: pwsh
        run: |
          $version = '0.2.2-rc.1.20261123.1'
          $url = "https://agentkit.ks3-cn-beijing.ksyuncs.com/studio/$version/AgentKit-Studio-win-x64.exe"
          $installer = Join-Path $env:RUNNER_TEMP 'AgentKit-Studio-setup.exe'
          curl.exe -fL --retry 2 --output $installer $url
          if ($LASTEXITCODE) { throw 'Download failed' }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw 'Invalid installer signature or missing timestamp' }
          $directory = Join-Path $env:RUNNER_TEMP 'StudioQualification'
          $process = Start-Process $installer -ArgumentList @('/S',"/D=$directory") -Wait -PassThru
          if ($process.ExitCode) { throw "Install failed: $($process.ExitCode)" }
          "STUDIO_QUALIFIED_EXE=$directory/AgentKit Studio.exe" | Out-File $env:GITHUB_ENV -Append
      - name: Upgrade and restart through the packaged plugin page
        shell: pwsh
        run: |
          node scripts/verify-plugin-restart-qualification.mjs "$env:STUDIO_QUALIFIED_EXE" .artifacts/plugin-restart
          if ($LASTEXITCODE) { throw 'Plugin restart qualification failed' }
      - name: Retain isolated fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-star-harness-plugin-restart
          path: |
            .artifacts/plugin-restart/evidence.json
            .artifacts/plugin-restart/*.png
          if-no-files-found: warn
