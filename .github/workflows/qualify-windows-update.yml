name: Qualify AgentKit Studio macOS Nightly update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-online-update:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      STUDIO_ORIGIN: https://agentkit.ks3-cn-beijing.ksyuncs.com
      STUDIO_BASELINE: 0.2.2-rc.1.20261124.1
      STUDIO_TARGET: 0.2.2-rc.1.20261125.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - run: pnpm install --frozen-lockfile
      - name: Download and validate the public Nightly feed
        run: node scripts/desktop-release.mjs verify-feed --origin "$STUDIO_ORIGIN" --channel nightly --version "$STUDIO_TARGET" --layout studio --output .artifacts/mac-online
      - name: Install the exact notarized public baseline
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/studio-online-update"
          mkdir -p "$root/mount" "$root/install"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 300 \
            "$STUDIO_ORIGIN/studio/$STUDIO_BASELINE/AgentKit-Studio-mac-arm64.dmg" -o "$root/baseline.dmg"
          printf '%s  %s\n' cab9e2c7c59de983411a27e86da1a7792738e37696a441cdeaddef72c1460053 "$root/baseline.dmg" | shasum -a 256 -c -
          hdiutil attach -readonly -nobrowse -mountpoint "$root/mount" "$root/baseline.dmg"
          trap 'hdiutil detach "$root/mount"' EXIT
          ditto "$root/mount/AgentKit Studio.app" "$root/install/AgentKit Studio.app"
      - name: Run the actual updater and observe its automatic successor
        run: node scripts/qualify-macos-nightly-online.mjs "$RUNNER_TEMP/studio-online-update/install/AgentKit Studio.app" .artifacts/mac-online
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-nightly-online-update-20261124.1-to-20261125.2
          path: .artifacts/mac-online/
          include-hidden-files: true
          if-no-files-found: warn
