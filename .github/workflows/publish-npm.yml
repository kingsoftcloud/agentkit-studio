name: Publish npm package

# 发布 @kingsoftcloud/agentkit-studio 到 npmjs。
# 使用 npm Trusted Publishing（OIDC），不需要在仓库里保存 token：
# npm 包设置页 → Trusted publishing → GitHub Actions，
# 填 kingsoftcloud/agentkit-studio + publish-npm.yml。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish
    # Playwright only ships browser deps for the LTS image; ubuntu-latest is 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - name: Install test Chromium
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/studio-native-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      # npm 11 crashes with "Exit handler never called!" when publish runs the
      # prepack lifecycle (the client builds spawn SQLite-backed child work).
      # Build the tarball contents first, then publish without lifecycle scripts.
      - name: Build package contents
        run: npm run prepack
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if pnpm view "@kingsoftcloud/agentkit-studio@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} already published, skipping."
            exit 0
          fi
          echo "node $(node --version) pnpm $(pnpm --version) event ${GITHUB_EVENT_NAME}"
          # npm CLI pack/publish abort with "Exit handler never called!" on this
          # runner and pnpm does not run the trusted-publishing exchange itself,
          # so exchange the GitHub OIDC token for a short-lived npm publish token.
          ID_TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          test -n "$ID_TOKEN" -a "$ID_TOKEN" != null
          NPM_TOKEN=$(curl -sS -X POST -H "Authorization: Bearer ${ID_TOKEN}"             "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@kingsoftcloud%2fagentkit-studio" | jq -r .token)
          test -n "$NPM_TOKEN" -a "$NPM_TOKEN" != null
          echo "::add-mask::$NPM_TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          pnpm publish --access public --no-git-checks --ignore-scripts || {
            echo '=== pnpm publish failed ==='; exit 1
          }
