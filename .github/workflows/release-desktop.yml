name: Prepare the exact Studio macOS Nightly upload

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agentkit-studio-9e496351ca12ac3b5fe97d12d618d15519b8755a
  cancel-in-progress: false

jobs:
  prepare-mac-nightly-request:
    runs-on: ubuntu-latest
    environment: studio-signing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reuse source and signing gates for the exact Studio candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45737190374/jobs" --jq '.jobs[] | select(.name=="source-gate" and .head_sha=="9e496351ca12ac3b5fe97d12d618d15519b8755a") | .conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45609895727" --jq .path)" = .github/workflows/release-desktop.yml
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45609895727/jobs" --jq '.jobs[] | select(.name=="macos-arm64") | .conclusion')" = success
      - uses: actions/download-artifact@v4
        with:
          name: agentkit-studio-9e496351ca12ac3b5fe97d12d618d15519b8755a-nightly-mac-arm64
          path: candidate
          github-token: ${{ github.token }}
          run-id: "45609895727"
      - name: Verify original signed candidate checksums
        working-directory: candidate
        run: shasum -a 256 -c SHA256SUMS
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Seal the one-object upload request
        env:
          STUDIO_DOWNLOAD_PROD_KS3_ACCESS_KEY: ${{ secrets.STUDIO_DOWNLOAD_PROD_KS3_ACCESS_KEY }}
          STUDIO_DOWNLOAD_PROD_KS3_SECRET_KEY: ${{ secrets.STUDIO_DOWNLOAD_PROD_KS3_SECRET_KEY }}
        run: node scripts/seal-macos-nightly-put.mjs candidate/deepseek-harness-0.2.2-rc.1.20261125.2-mac-arm64.zip "$RUNNER_TEMP/nightly-zip-request.sealed"
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-nightly-zip-request
          path: ${{ runner.temp }}/nightly-zip-request.sealed
          if-no-files-found: error
          retention-days: 1
