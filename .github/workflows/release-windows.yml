name: Release AgentKit Studio Windows

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed run whose signed installer and installation checks passed
        type: string
        default: ''
      release_tools_ref:
        description: Immutable commit for qualification tools; defaults to studio_ref
        type: string
        default: ''
      diagnostic_only:
        description: Run unsigned packaging smoke without publishing or installer qualification
        type: boolean
        default: false
      harness_upgrade_from:
        description: Published signed Harness baseline, required for a signed Windows candidate
        type: string
        default: ''
      harness_upgrade_to:
        description: Published signed Harness upgrade, required for a signed Windows candidate
        type: string
        default: ''
      qualify_telemetry:
        description: Build a signed candidate with a local telemetry fixture and run native qualification
        type: boolean
        default: false
      telemetry_baseline_tag:
        description: Signed Studio release tag used as the installed telemetry upgrade baseline
        default: desktop-0.2.2-rc.1.20261117.4
        type: string
      studio_ref:
        description: Immutable Studio source commit
        type: string
        required: true
      studio_checkout_ref:
        description: Branch containing the immutable source commit
        type: string
        default: main
        required: true
      build_version:
        description: Desktop semantic version; empty uses the qualified product definition
        type: string
        required: false
        default: ''
      channel:
        description: Empty uses the qualified product definition; otherwise nightly, latest, preview or stable
        type: string
        default: ''
      update_origin:
        description: HTTPS origin; empty uses the qualified product definition
        type: string
        default: ''
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: studio-windows-signing
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2025
    environment: studio-signing
    # The signed installer is ~450 MB and the artifact service is slow from this
    # runner, so the retention step needs more headroom than the build itself.
    timeout-minutes: 150
    steps:
      - name: Validate telemetry qualification options
        if: ${{ inputs.qualify_telemetry && inputs.diagnostic_only }}
        shell: pwsh
        run: throw 'Telemetry qualification requires a signed candidate'
      - name: Validate Harness qualification options
        if: ${{ !inputs.diagnostic_only || inputs.harness_upgrade_from != '' || inputs.harness_upgrade_to != '' }}
        shell: pwsh
        env:
          HARNESS_UPGRADE_FROM: ${{ inputs.harness_upgrade_from }}
          HARNESS_UPGRADE_TO: ${{ inputs.harness_upgrade_to }}
        run: |
          $pattern = '^\d{1,5}\.\d{1,5}\.\d{1,5}$'
          if ($env:HARNESS_UPGRADE_FROM -notmatch $pattern -or $env:HARNESS_UPGRADE_TO -notmatch $pattern -or
              $env:HARNESS_UPGRADE_FROM -eq $env:HARNESS_UPGRADE_TO) {
            throw 'Provide two distinct signed Harness versions'
          }
      - name: Preserve canonical source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.studio_checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable Studio source
        shell: pwsh
        env:
          STUDIO_SHA: ${{ inputs.studio_ref }}
          TOOLS_SHA: ${{ inputs.release_tools_ref || inputs.studio_ref }}
        run: |
          if ($env:STUDIO_SHA -notmatch '^[0-9a-f]{40}$') { throw 'studio_ref must be a full commit SHA' }
          if ($env:TOOLS_SHA -notmatch '^[0-9a-f]{40}$') { throw 'release_tools_ref must be a full commit SHA' }
          git merge-base --is-ancestor $env:TOOLS_SHA HEAD
          if ($LASTEXITCODE) { throw 'Qualification tools are outside the selected branch' }
          git merge-base --is-ancestor $env:STUDIO_SHA HEAD
          if ($LASTEXITCODE) { throw 'Source commit is outside the selected branch' }
          git checkout --detach $env:STUDIO_SHA
          if ($LASTEXITCODE -or (git rev-parse HEAD) -ne $env:STUDIO_SHA) { throw 'Studio checkout mismatch' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tools_ref || inputs.studio_ref }}
          path: .qualification-tools
          persist-credentials: false
      - name: Checkout workflow-owned public product resolver
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .product-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        if: ${{ inputs.candidate_run_id == '' }}
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.2-rc.1
          path: dsh-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        if: ${{ inputs.candidate_run_id == '' }}
        with:
          version: 11.28.5
          package_json_file: dsh-source/package.json
      - uses: pnpm/action-setup@v4
        if: ${{ inputs.candidate_run_id != '' }}
        with:
          version: 10.33.2
          package_json_file: package.json
      - name: Select the Electron download mirror
        # The GitHub release CDN intermittently answers 504 for the Electron
        # inputs. The checksum manifest and the platform archive fail
        # independently - on 2026-11-09 the manifest was healthy while
        # electron-v44.7.0-win32-x64.zip returned 504 for every attempt, which
        # aborted packaging after the probe had already passed. Probe both with
        # a HEAD request and only redirect Electron downloads to the npmmirror
        # copy when the official source is unusable, so a healthy runner keeps
        # using GitHub.
        shell: pwsh
        run: |
          $base = 'https://github.com/electron/electron/releases/download/v44.7.0'
          $probes = @("$base/SHASUMS256.txt", "$base/electron-v44.7.0-win32-x64.zip")
          $unreachable = @()
          foreach ($probe in $probes) {
            curl.exe -fsSLI --retry 3 --retry-delay 2 --max-time 60 --output NUL $probe
            if ($LASTEXITCODE -ne 0) { $unreachable += $probe }
          }
          if ($unreachable.Count -eq 0) {
            Write-Host 'electron mirror fallback: disabled'
          } else {
            Write-Host "official Electron probe failed for: $($unreachable -join ', ')"
            'ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host 'electron mirror fallback: enabled'
          }
      - name: Resolve qualified public product inputs
        id: product
        shell: pwsh
        env:
          STUDIO_PRODUCT_BUILD_VERSION: ${{ inputs.build_version }}
          STUDIO_PRODUCT_UPDATE_ORIGIN: ${{ inputs.update_origin }}
          STUDIO_PRODUCT_CHANNEL: ${{ inputs.channel }}
        run: |
          $values = & node .product-tools/scripts/product-config.mjs github-outputs "$PWD"
          if ($LASTEXITCODE) { throw 'Public product input resolution failed' }
          $values | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Prepare verified signed candidate reuse
        if: ${{ inputs.candidate_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.studio_ref }}
          BUILD_VERSION: ${{ steps.product.outputs.build_version }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          if ('${{ inputs.diagnostic_only }}' -eq 'true') { throw 'Signed candidate reuse cannot be diagnostic-only' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Qualification dependencies failed' }
          $fixture = @()
          if ('${{ inputs.qualify_telemetry }}' -eq 'true') { $fixture += '--telemetry-qualification' }
          node .qualification-tools/scripts/prepare-windows-candidate.mjs --repository '${{ github.repository }}' --run $env:CANDIDATE_RUN --source $env:SOURCE_SHA --version $env:BUILD_VERSION --output .artifacts/windows-candidate @fixture
          if ($LASTEXITCODE) { throw 'Signed candidate identity or digest failed' }
          Expand-Archive -LiteralPath .artifacts/windows-candidate/candidate.zip -DestinationPath .artifacts/windows-candidate/unpacked
          $candidate = @(Get-ChildItem .artifacts/windows-candidate/unpacked -Directory -Recurse | Where-Object { $_.Name -eq 'windows-release' })
          if ($candidate.Count -ne 1) { throw 'Expected one signed release directory' }
          "STUDIO_REUSE_ARTIFACTS=$($candidate[0].FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Prepare short isolated build root
        if: ${{ inputs.candidate_run_id == '' }}
        shell: pwsh
        run: |
          if ((git -C dsh-source rev-parse HEAD) -ne '66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db') { throw 'DSH baseline mismatch' }
          git config --system core.longpaths true
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Studio dependency installation failed' }
          pnpm pack --pack-destination .artifacts
          if ($LASTEXITCODE) { throw 'Studio plugin pack failed' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $inputRoot = Join-Path $env:RUNNER_TEMP 'studio-plugin-input'
          New-Item -ItemType Directory -Force $inputRoot | Out-Null
          Copy-Item ".artifacts/kingsoftcloud-agentkit-studio-$version.tgz" $inputRoot
          if (Test-Path scripts/stage-routemind-desktop-plugin.mjs) {
            node scripts/stage-routemind-desktop-plugin.mjs $inputRoot
            if ($LASTEXITCODE) { throw 'RouteMind plugin staging failed' }
          }
          "DSH_DESKTOP_PLUGIN_INPUTS=$inputRoot" | Out-File $env:GITHUB_ENV -Append
          "STUDIO_PACKAGE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
      - name: Prepare fresh Certum authentication URI
        if: ${{ ! inputs.diagnostic_only && inputs.candidate_run_id == '' }}
        id: certum
        shell: pwsh
        env:
          CERTUM_ACCOUNT: ${{ secrets.CERTUM_ACCOUNT }}
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
        run: |
          $account = if ($env:CERTUM_ACCOUNT) {$env:CERTUM_ACCOUNT} else {$env:CERTUM_EMAIL}
          if (-not $account -or -not $env:CERTUM_TOTP_SECRET) { throw 'Certum account and TOTP configuration are required' }
          $seed = $env:CERTUM_TOTP_SECRET.Trim()
          if ($seed.StartsWith('otpauth://')) { $uri = $seed }
          elseif ($seed -match '^[A-Za-z2-7]+=*$') { $uri = "otpauth://totp/SimplySign?secret=$seed&algorithm=SHA256&digits=6&period=30" }
          else { throw 'CERTUM_TOTP_SECRET must be a Base32 seed or complete otpauth URI' }
          Write-Output "::add-mask::$uri"
          Write-Output "::add-mask::$account"
          "uri=$uri" | Out-File $env:GITHUB_OUTPUT -Append
          "account=$account" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Authenticate Certum cloud certificate
        if: ${{ ! inputs.diagnostic_only && inputs.candidate_run_id == '' }}
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
        with:
          certum-username: ${{ steps.certum.outputs.account }}
          certum-otp-uri: ${{ steps.certum.outputs.uri }}
          certum-key-id: ${{ secrets.CERTUM_THUMBPRINT }}
          capture-diagnostics: 'false'
      - name: Configure verified certificate-store signing
        if: ${{ ! inputs.diagnostic_only && inputs.candidate_run_id == '' }}
        shell: pwsh
        env:
          CERTUM_THUMBPRINT: ${{ secrets.CERTUM_THUMBPRINT }}
          UPDATE_ORIGIN: ${{ steps.product.outputs.update_origin }}
          CHANNEL: ${{ steps.product.outputs.channel }}
          STUDIO_PRODUCT_APP_ID: ${{ steps.product.outputs.app_id }}
          STUDIO_PRODUCT_UPDATE_ENV: ${{ steps.product.outputs.update_environment }}
        run: ./.product-tools/scripts/prepare-windows-signing.ps1 -DshRoot "$PWD/dsh-source" -UpdateOrigin $env:UPDATE_ORIGIN -Channel $env:CHANNEL -AppId $env:STUDIO_PRODUCT_APP_ID -UpdateEnvironment $env:STUDIO_PRODUCT_UPDATE_ENV
      - name: Configure isolated unsigned diagnostic package
        if: ${{ inputs.diagnostic_only && inputs.candidate_run_id == '' }}
        shell: pwsh
        env:
          UPDATE_ORIGIN: ${{ steps.product.outputs.update_origin }}
          CHANNEL: ${{ steps.product.outputs.channel }}
          STUDIO_PRODUCT_APP_ID: ${{ steps.product.outputs.app_id }}
          STUDIO_PRODUCT_UPDATE_ENV: ${{ steps.product.outputs.update_environment }}
        run: |
          $uri = [Uri]$env:UPDATE_ORIGIN
          if ($uri.Scheme -ne 'https' -or $uri.UserInfo -or $uri.AbsolutePath -ne '/') { throw 'Invalid update origin' }
          $settings = @{
            DSH_DESKTOP_APP_ID = $env:STUDIO_PRODUCT_APP_ID
            DSH_DESKTOP_AUTO_UPDATE_ENV = $env:STUDIO_PRODUCT_UPDATE_ENV
            DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN = $env:UPDATE_ORIGIN
            DSH_DESKTOP_UPDATE_ORIGIN = $env:UPDATE_ORIGIN
            DSH_DESKTOP_UPDATE_CHANNEL = $env:CHANNEL
          }
          $lines = foreach ($entry in $settings.GetEnumerator()) { "$($entry.Key)='$($entry.Value)'" }
          [IO.File]::WriteAllText("$PWD/dsh-source/apps/desktop/.env.windows", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - name: Package the official DSH Windows target
        if: ${{ inputs.candidate_run_id == '' }}
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.product.outputs.build_version }}
          DSH_CLIENT_TITLE: ${{ steps.product.outputs.name }}
          DSH_DESKTOP_PLUGIN_ROOTS: ${{ steps.product.outputs.plugin_roots }}
          DSH_DESKTOP_PLUGIN_BUNDLES: ${{ steps.product.outputs.plugin_bundles }}
          STUDIO_PRODUCT_ICON: ${{ steps.product.outputs.windows_icon }}
          STUDIO_PRODUCT_TRAY_ICON: ${{ steps.product.outputs.windows_tray_icon }}
          AGENTKIT_TELEMETRY_RELEASE_POLICY: ${{ inputs.qualify_telemetry && '{"endpoint":"https://127.0.0.1:49331/v1/logs","defaultBasic":false,"policyRevision":"qualification-v1"}' || vars.STUDIO_TELEMETRY_RELEASE_POLICY }}
        run: |
          [string[]]$packageArguments = @('--source', "$PWD/dsh-source", '--output', "$env:RUNNER_TEMP/studio-build", '--patches', "$PWD/patches/dsh-v0.2.2-rc.1", '--commit', '66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db', '--target', 'win-x64', '--dsh-version', '0.2.2-rc.1', '--studio-version', $env:STUDIO_PACKAGE_VERSION, '--build-version', $env:BUILD_VERSION)
          if ('${{ inputs.diagnostic_only }}' -eq 'true') { $packageArguments += '--unsigned' }
          $env:DSH_DESKTOP_PRODUCT_ICON = Join-Path $PWD $env:STUDIO_PRODUCT_ICON
          $env:DSH_DESKTOP_PRODUCT_TRAY_ICON = Join-Path $PWD $env:STUDIO_PRODUCT_TRAY_ICON
          pnpm exec node scripts/package-desktop.mjs @packageArguments
          if ($LASTEXITCODE) { throw 'Signed Windows packaging failed' }
      - name: Verify the packaged drag-region contract
        # The previous Windows package shipped the old whole-viewport caption rule
        # even though the repair existed on a branch. Inspect the final archive
        # before the installer is retained; a mismatch fails the build.
        if: ${{ inputs.candidate_run_id == '' }}
        id: packaged-drag-region
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts/windows-proof | Out-Null
          $targetRoot = "$env:RUNNER_TEMP/studio-build/desktop-checkouts/*/source/apps/desktop/.desktop-build/targets/win-x64"
          $outputs = @(Get-Item "$targetRoot/artifacts", "$targetRoot/unsigned-artifacts" -ErrorAction SilentlyContinue)
          $archives = @($outputs | ForEach-Object { Join-Path $_.FullName 'win-unpacked/resources/app.asar' } |
            Where-Object { Test-Path -LiteralPath $_ })
          Write-Host "Packaged output directories: $($outputs.FullName -join ', ')"
          Write-Host "Packaged app.asar candidates: $($archives -join ', ')"
          if ($archives.Count -ne 1) { throw "Expected exactly one packaged app.asar, found $($archives.Count)" }
          $archive = $archives[0]
          "archive=$archive" >> $env:GITHUB_OUTPUT
          node .qualification-tools/scripts/verify-packaged-drag-region.mjs $archive --json .artifacts/windows-proof/drag-region.json
          if ($LASTEXITCODE) { throw 'Packaged drag-region contract failed' }
          Copy-Item -LiteralPath $archive -Destination .artifacts/windows-proof/app.asar
          (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content .artifacts/windows-proof/app.asar.sha256
      - name: Verify timestamped installer and actual installation
        if: ${{ ! inputs.diagnostic_only }}
        id: installed
        shell: pwsh
        env:
          CERTUM_THUMBPRINT: ${{ secrets.CERTUM_THUMBPRINT }}
          BUILD_VERSION: ${{ steps.product.outputs.build_version }}
        run: |
          if ($env:STUDIO_REUSE_ARTIFACTS) { $artifacts = $env:STUDIO_REUSE_ARTIFACTS }
          else {
            $candidates = @(Get-Item "$env:RUNNER_TEMP/studio-build/desktop-checkouts/*/source/apps/desktop/.desktop-build/targets/win-x64/artifacts")
            if ($candidates.Count -ne 1) { throw 'Expected exactly one signed output directory' }
            $artifacts = $candidates[0].FullName
          }
          ./.qualification-tools/scripts/verify-windows-install.ps1 -Artifacts $artifacts -Version $env:BUILD_VERSION -Evidence .artifacts/windows-proof
          if ('${{ inputs.qualify_telemetry }}' -eq 'true') {
            $receipt = Get-Content .artifacts/windows-proof/windows-install.json -Raw | ConvertFrom-Json
            $policy = Join-Path (Split-Path $receipt.installedPath) 'resources/studio-telemetry/policy.json'
            if (-not (Test-Path -LiteralPath $policy -PathType Leaf)) { throw 'The freshly installed signed App is missing its telemetry policy' }
          }
          New-Item -ItemType Directory -Force .artifacts/windows-release | Out-Null
          # Retain only the files a publication consumes. Copying the whole build
          # directory pulls in win-unpacked/ and installer caches (multi-GB) and
          # the artifact upload then outlives the job timeout.
          Get-ChildItem -LiteralPath $artifacts -File -Force |
            Where-Object { $_.Extension -in @('.exe', '.blockmap', '.yml') } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination .artifacts/windows-release }
          $retained = Get-ChildItem .artifacts/windows-release -File
          if (-not ($retained.Extension -contains '.exe')) { throw 'no signed installer retained' }
          $retained | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          if (Test-Path .artifacts/windows-candidate/provenance.json) { Copy-Item .artifacts/windows-candidate/provenance.json .artifacts/windows-proof/candidate-provenance.json }
      - name: Verify signed Harness upgrade and restart through the Windows UI
        if: ${{ inputs.harness_upgrade_from != '' && inputs.harness_upgrade_to != '' }}
        timeout-minutes: 20
        shell: pwsh
        env:
          HARNESS_UPGRADE_FROM: ${{ inputs.harness_upgrade_from }}
          HARNESS_UPGRADE_TO: ${{ inputs.harness_upgrade_to }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          PACKAGED_ARCHIVE: ${{ steps.packaged-drag-region.outputs.archive }}
        run: |
          $app = $env:STUDIO_INSTALLED_APP
          if ($env:DIAGNOSTIC_ONLY -eq 'true') {
            $app = Join-Path (Split-Path (Split-Path $env:PACKAGED_ARCHIVE)) 'AgentKit Studio.exe'
          }
          if (-not $app -or -not (Test-Path -LiteralPath $app -PathType Leaf)) { throw 'Studio executable is missing' }
          node .qualification-tools/scripts/verify-desktop-harness-upgrade.mjs $app $env:HARNESS_UPGRADE_FROM $env:HARNESS_UPGRADE_TO .artifacts/windows-proof/harness-upgrade
          if ($LASTEXITCODE) { throw 'Windows Harness upgrade and original-conversation recovery failed' }
      - name: Verify the actually installed Windows App UI
        if: ${{ ! inputs.diagnostic_only }}
        timeout-minutes: 20
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.product.outputs.build_version }}
          AGENTKIT_TELEMETRY_DISABLED: '1'
        run: |
          node .qualification-tools/scripts/verify-desktop-module-graph.mjs (Join-Path (Split-Path $env:STUDIO_INSTALLED_APP) 'resources/app.asar') --studio | Out-File .artifacts/windows-proof/studio-module-graph.json -Encoding utf8
          if ($LASTEXITCODE) { throw 'Installed Studio archive verification failed' }
          node .qualification-tools/scripts/verify-desktop-harness-release.mjs $env:STUDIO_INSTALLED_APP
          if ($LASTEXITCODE) { throw 'Installed Studio Harness signature verification failed' }
          node .qualification-tools/scripts/verify-windows-app-ui.mjs
          if ($LASTEXITCODE) { throw 'Installed Windows App UI acceptance failed' }
      - name: Verify telemetry in the signed Windows installation
        if: ${{ !cancelled() && inputs.qualify_telemetry && steps.installed.conclusion == 'success' }}
        timeout-minutes: 10
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.product.outputs.build_version }}
          BASELINE_TAG: ${{ inputs.telemetry_baseline_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_TAG" =~ ^desktop-[0-9A-Za-z.+-]+$ ]]
          baseline_dir=$(mktemp -d)
          echo 'Downloading the previously released signed installer for the upgrade test'
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-win-x64.exe' --dir "$baseline_dir"
          baseline_installer=$(find "$baseline_dir" -maxdepth 1 -name '*.exe' -print -quit)
          test -s "$baseline_installer"
          node .qualification-tools/scripts/verify-installed-desktop-telemetry.mjs --version "$BUILD_VERSION" --baseline "$baseline_installer" --baseline-version "${BASELINE_TAG#desktop-}" --installer "$STUDIO_SIGNED_INSTALLER" --output .artifacts/windows-proof/desktop-telemetry.json
      - name: Collect credential-free packaging diagnostics
        if: always() && inputs.diagnostic_only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts/windows-diagnostics | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/studio-build/desktop-checkouts" -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object {
            $runs = Join-Path $_.FullName 'source/apps/desktop/.desktop-build/packaging-runs'
            if (Test-Path $runs) {
              Get-ChildItem -LiteralPath $runs -Recurse -File -Force |
                Where-Object { $_.Extension -in @('.json', '.jsonl', '.log') } |
                ForEach-Object { Copy-Item $_.FullName (Join-Path '.artifacts/windows-diagnostics' ($_.Directory.Name + '-' + $_.Name)) }
            }
          }
      - name: Retain signed installer and acceptance evidence
        # A failed packaged drag-region check must not leave an installer behind.
        if: ${{ always() && (inputs.candidate_run_id != '' || steps.packaged-drag-region.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: agentkit-studio-${{ steps.product.outputs.build_version }}-win-x64${{ inputs.qualify_telemetry && '-telemetry-qualification' || '' }}
          path: |
            .artifacts/windows-release/
            .artifacts/windows-proof/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove local signing settings
        if: always()
        shell: pwsh
        run: |
          Remove-Item dsh-source/apps/desktop/.env.windows -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:RUNNER_TEMP/studio-code-signing.cer" -Force -ErrorAction SilentlyContinue
