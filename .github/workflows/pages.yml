name: Deploy AgentKit Studio site

# The public site is a Fumadocs static export (bilingual: Chinese at /docs,
# English at /en/docs). This workflow only builds the documentation app; the
# hand-written landing page at docs/index.html is copied in by the build script
# and is intentionally outside the documentation app.
on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - docs/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install documentation dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Verify bilingual parity and links
        run: node --test tests/docs-site-i18n.test.mjs

      - name: Build the documentation site
        working-directory: docs-site
        env:
          NEXT_PUBLIC_BASE_PATH: /agentkit-studio
        run: pnpm build:static

      - name: Report the exported size
        run: du -sh docs-site/out

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out

  deploy:
    name: deploy
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
