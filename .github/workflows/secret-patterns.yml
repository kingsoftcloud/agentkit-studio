name: Secret Pattern Audit

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install verified scanner
        run: |
          bash ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - name: Run full tracked-file public surface audit
        run: node scripts/public-surface-audit.mjs
      - name: Run Gitleaks
        if: ${{ !cancelled() }}
        run: node scripts/secret-scan.mjs
