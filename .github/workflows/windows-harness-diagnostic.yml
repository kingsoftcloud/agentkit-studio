name: Diagnose installed Star Harness on Windows
on:
  push:
    branches: [codex/studio-win-harness-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kingsoftcloud/ksadk-harness
          ref: 0a58bd9088395eb42680b03c5c3f0bc6deaccb46
          path: harness-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Build the exact Harness review candidate
        working-directory: harness-candidate
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
      - name: Print the underlying workspace persistence error from the fixture
        working-directory: harness-candidate
        shell: pwsh
        run: |
          $file = 'packages/agentkit-harness-node/src/native/workspace-tools.mjs'
          $source = Get-Content $file -Raw
          $target = "if (mutations.size) return { status: 'uncertain', workspaceChangedPaths: [...mutations],"
          $previous = "} catch (e) {"
          $anchor = $source.IndexOf($target)
          if ($anchor -lt 0) { throw 'Missing fixture catch' }
          $offset = $source.LastIndexOf($previous, $anchor)
          if ($offset -lt 0) { throw 'Missing fixture persistence catch' }
          $source = $source.Insert($offset + $previous.Length, "`n      console.error(e);")
          Set-Content -LiteralPath $file -Value $source -Encoding utf8
          node --test packages/agentkit-harness-node/test/native-engine-private-state.test.mjs
