name: AgentKit Studio CI

on:
  push:
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make release-check

  dsh-node-store:
    runs-on: ubuntu-latest
    env:
      DSH_ROOT: ${{ runner.temp }}/deepseek-harness
      DSH_REF: dsh-v0.1.7-rc.2
      DSH_COMMIT: 477b4f420553e8a52c2fbccc464d7561b239c443
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checkout pinned public DSH
        run: git clone --branch "$DSH_REF" --depth 1 https://github.com/deepseek-ai/deepseek-harness.git "$DSH_ROOT"
      - name: Verify DSH release pin
        run: test "$(git -C "$DSH_ROOT" rev-parse HEAD)" = "$DSH_COMMIT"
      - name: Install DSH dependencies
        working-directory: ${{ runner.temp }}/deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Verify official DSH node store
        run: AGENTKIT_DSH_ROOT="$DSH_ROOT" pnpm verify-dsh
      - name: Verify official DSH SDK node store
        run: AGENTKIT_DSH_ROOT="$DSH_ROOT" pnpm verify-dsh-sdk
