name: CI

on:
  push:
    branches: [main, 'codex/native-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded pull-request runs never block a newer commit's gate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: public-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository DSH pin
        run: node scripts/check-dsh-pin.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - name: Restore test Chromium cache
        id: playwright-browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/studio-native-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install test Chromium
        timeout-minutes: 12
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/studio-native-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          if [[ "${{ steps.playwright-browsers.outputs.cache-hit }}" == "true" ]]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - run: pnpm build:harness
      - run: |
          bash ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - run: bash ci/run-public-gate.sh
  patched-host:
    name: patched-dsh-host
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the runner within the locked Playwright browser installer support.
        os: [ubuntu-24.04]
    timeout-minutes: 35
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate repository DSH pin
        id: dsh-pin
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-dsh-pin.mjs
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { dshPin } from './scripts/dsh-pin.mjs'
          console.log(`ref=${dshPin.ref}`)
          console.log(`commit=${dshPin.commit}`)
          console.log(`patches=${dshPin.patchDirectory}`)
          NODE
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.dsh-pin.outputs.ref }}
          path: .ci-dsh
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/check-node-version.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          package_json_file: .ci-dsh/package.json
      - run: pnpm install --frozen-lockfile
      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.ci-dsh/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install native libc test toolchain
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # A flaky runner mirror used to consume the whole job budget here.
          sudo apt-get update -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build and test the patched DSH host
        timeout-minutes: 15
        run: pnpm exec node scripts/verify-patched-dsh-host.mjs --source .ci-dsh --patches "${{ steps.dsh-pin.outputs.patches }}" --output .artifacts/patched-host --report .artifacts/patched-host-acceptance.json
      - name: Verify actual Native turn ownership, approvals and process recovery
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          log="$PWD/.artifacts/native-host-contracts.log"
          trap 'cat "$log"' EXIT
          dsh_root="$(node -p "JSON.parse(require('fs').readFileSync('.artifacts/patched-host-acceptance.json')).checkout")"
          node scripts/verify-native-dsh-turn.mjs --source "$dsh_root" --context --live > "$log" 2>&1
          node scripts/verify-native-durable-approval.mjs --source "$dsh_root" >> "$log" 2>&1
          node scripts/verify-native-owned-recovery.mjs --source "$dsh_root" >> "$log" 2>&1
          node scripts/verify-studio-native-harness.mjs --source "$dsh_root" --mount-host --recovery >> "$log" 2>&1
      - name: Verify normal installed assistant cold startup and restart
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/assistant-automatic-startup/dsh"
          export AGENTKIT_HOME="$RUNNER_TEMP/assistant-automatic-startup/agentkit"
          export CODEX_HOME="$RUNNER_TEMP/assistant-automatic-startup/codex"
          export DSH_TELEMETRY_DISABLED=1
          dsh_root="$(node -p "JSON.parse(require('fs').readFileSync('.artifacts/patched-host-acceptance.json')).checkout")"
          make profile-install DSH_ROOT="$dsh_root" DSH_PROFILE=automatic-startup PACK_DIR=.artifacts/automatic-startup
          installation="$DSH_HOME/profiles/automatic-startup"
          ln -s "$dsh_root/apps/cli" "$installation/node_modules/@deepseek-ai/dsh"
          version="$(node -p "require('./package.json').version")"
          archive="$PWD/.artifacts/automatic-startup/kingsoftcloud-agentkit-studio-$version.tgz"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          node scripts/verify-assistant-automatic-startup.mjs "$installation" "$archive" \
            .artifacts/assistant-automatic-startup.json "$digest" --profile-migration --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-dsh-host-${{ matrix.os }}
          path: |
            .artifacts/patched-host-acceptance.json
            .artifacts/patched-host/host-tests.json
            .artifacts/patched-host/host-dependency-lifecycle.json
            .artifacts/native-host-contracts.log
            .artifacts/assistant-automatic-startup.json
          if-no-files-found: error
          retention-days: 7
