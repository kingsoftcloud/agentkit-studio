name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: public-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: |
          bash ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - run: make public-gate
  patched-host:
    name: patched-dsh-host
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    timeout-minutes: 35
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.1-rc.2
          path: .ci-dsh
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/check-node-version.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          package_json_file: .ci-dsh/package.json
      - run: pnpm install --frozen-lockfile
      - name: Install native libc test toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: pnpm exec node scripts/verify-patched-dsh-host.mjs --source .ci-dsh --patches patches/dsh-v0.2.1-rc.2 --output .artifacts/patched-host --report .artifacts/patched-host-acceptance.json
      - name: Verify normal installed assistant cold startup and restart
        shell: bash
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/assistant-automatic-startup/dsh"
          export AGENTKIT_HOME="$RUNNER_TEMP/assistant-automatic-startup/agentkit"
          export CODEX_HOME="$RUNNER_TEMP/assistant-automatic-startup/codex"
          export DSH_TELEMETRY_DISABLED=1
          dsh_root="$(node -p "JSON.parse(require('fs').readFileSync('.artifacts/patched-host-acceptance.json')).checkout")"
          make profile-install DSH_ROOT="$dsh_root" DSH_PROFILE=automatic-startup PACK_DIR=.artifacts/automatic-startup
          installation="$DSH_HOME/profiles/automatic-startup"
          ln -s "$dsh_root/apps/cli" "$installation/node_modules/@deepseek-ai/dsh"
          version="$(node -p "require('./package.json').version")"
          archive="$PWD/.artifacts/automatic-startup/kingsoftcloud-agentkit-studio-$version.tgz"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          node scripts/verify-assistant-automatic-startup.mjs "$installation" "$archive" \
            .artifacts/assistant-automatic-startup.json "$digest" --profile-migration --source-commit "$GITHUB_SHA"
      - name: Install Chromium for assistant acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify native assistant surfaces in the browser
        shell: bash
        env:
          STUDIO_VERIFY_UI: '1'
          STUDIO_VERIFY_PROFILE: automatic-startup
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/assistant-automatic-startup/dsh"
          export AGENTKIT_HOME="$RUNNER_TEMP/assistant-automatic-startup/agentkit"
          export CODEX_HOME="$RUNNER_TEMP/assistant-automatic-startup/codex"
          export DSH_TELEMETRY_DISABLED=1
          export AGENTKIT_DSH_ROOT="$(node -p "JSON.parse(require('fs').readFileSync('.artifacts/patched-host-acceptance.json')).checkout")"
          export STUDIO_VERIFY_CHROME="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          node scripts/verify-personal-assistant-host.mjs .artifacts/assistant-native-web/assistant.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-dsh-host-${{ matrix.os }}
          path: |
            .artifacts/patched-host-acceptance.json
            .artifacts/patched-host/host-tests.json
            .artifacts/patched-host/host-dependency-lifecycle.json
            .artifacts/assistant-automatic-startup.json
            .artifacts/assistant-native-web/
          if-no-files-found: error
          retention-days: 7
