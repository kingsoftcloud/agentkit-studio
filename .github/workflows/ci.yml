name: CI

on:
  push:
    branches: [main, 'codex/native-*']
  pull_request:
    branches: [main]
  # Merge queue entries run the same required checks on a
  # `gh-readonly-queue/main/pr-*` ref. Without this event the queued entry can
  # never satisfy `public-gate`/`patched-dsh-host` and never merges.
  merge_group:

permissions:
  contents: read

# Superseded pull-request runs never block a newer commit's gate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: public-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository DSH pin
        run: node scripts/check-dsh-pin.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - name: Restore test Chromium cache
        id: playwright-browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/studio-native-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install test Chromium
        timeout-minutes: 12
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/studio-native-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          if [[ "${{ steps.playwright-browsers.outputs.cache-hit }}" == "true" ]]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - run: pnpm build:harness
      - run: |
          bash ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - run: bash ci/run-public-gate.sh
  native-engine-integration:
    name: native-engine-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kingsoftcloud/ksadk-harness
          ref: 5f196ee3a8aeea0bbdb2fdc34c2d3128246839d5
          path: .ci-harness
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Build independent Harness
        working-directory: .ci-harness
        run: |
          npm ci
          npm run build
      - name: Verify service approvals and acceptance
        env:
          AGENTKIT_STUDIO_TEST_ENGINE_SERVER: ${{ github.workspace }}/.ci-harness/packages/agentkit-harness-node/src/native/engine-server.mjs
        run: node --test tests/native-engine-runtime.test.mjs tests/native-host-approval.test.mjs
  patched-host:
    name: patched-dsh-host
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the runner within the locked Playwright browser installer support.
        os: [ubuntu-24.04]
    timeout-minutes: 55
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate repository DSH pin
        id: dsh-pin
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-dsh-pin.mjs
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { dshPin } from './scripts/dsh-pin.mjs'
          console.log(`ref=${dshPin.ref}`)
          console.log(`commit=${dshPin.commit}`)
          console.log(`patches=${dshPin.patchDirectory}`)
          NODE
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.dsh-pin.outputs.ref }}
          path: .ci-dsh
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/check-node-version.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          package_json_file: .ci-dsh/package.json
      - run: pnpm install --frozen-lockfile
      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.ci-dsh/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install native libc test toolchain
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # A flaky runner mirror used to consume the whole job budget here.
          sudo apt-get update -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build and test the patched DSH host
        timeout-minutes: 15
        run: pnpm exec node scripts/verify-patched-dsh-host.mjs --source .ci-dsh --patches "${{ steps.dsh-pin.outputs.patches }}" --output .artifacts/patched-host --report .artifacts/patched-host-acceptance.json
      - name: Restore test Chromium cache
        id: patched-playwright-browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/studio-native-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Chromium for the frozen Host proof
        timeout-minutes: 12
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/studio-native-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          if [[ "${{ steps.patched-playwright-browsers.outputs.cache-hit }}" == "true" ]]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Install the accepted Studio plugin in an isolated profile
        shell: bash
        run: |
          set -euo pipefail
          host_source="$(node -p "JSON.parse(require('fs').readFileSync('.artifacts/patched-host-acceptance.json')).checkout")"
          export DSH_HOME="$RUNNER_TEMP/studio-frozen-dsh"
          export AGENTKIT_HOME="$RUNNER_TEMP/studio-frozen-agentkit"
          make profile-install DSH_ROOT="$host_source" DSH_PROFILE=studio-refactor
          {
            echo "AGENTKIT_DSH_ROOT=$host_source"
            echo "DSH_HOME=$DSH_HOME"
            echo "AGENTKIT_HOME=$AGENTKIT_HOME"
            echo "STUDIO_VERIFY_PROFILE=studio-refactor"
            echo "STUDIO_VERIFY_CHROME=$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')"
          } >> "$GITHUB_ENV"
      - name: Verify the real frozen Host MCP turn
        timeout-minutes: 12
        run: node scripts/verify-studio-frozen-host.mjs .artifacts/frozen-host.json
      - name: Verify packed Studio switches independent workspace services
        timeout-minutes: 3
        run: node scripts/verify-independent-workspace-host.mjs ".artifacts/kingsoftcloud-agentkit-studio-$(node -p "require('./package.json').version").tgz"
      - name: Verify actual Native turn ownership, approvals and process recovery
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          log="$PWD/.artifacts/native-host-contracts.log"
          trap 'cat "$log"' EXIT
          dsh_root="$(node -p "JSON.parse(require('fs').readFileSync('.artifacts/patched-host-acceptance.json')).checkout")"
          node scripts/verify-native-dsh-turn.mjs --source "$dsh_root" --context --live > "$log" 2>&1
          node scripts/verify-native-durable-approval.mjs --source "$dsh_root" >> "$log" 2>&1
          node scripts/verify-native-owned-recovery.mjs --source "$dsh_root" >> "$log" 2>&1
          # The mounted Host proof (`verify-studio-native-harness.mjs
          # --mount-host`) is temporarily ungated. Both of its shapes are
          # blocked on the same external-turn scheduling change from patch 080:
          #   * `--recovery` crashes from a `sessions.flush` wrapper that only
          #     fires once a `turn/owner` admission is visible; claim() only
          #     appends that admission before the first step, so a lost claim
          #     runs the turn natively and the proof fails with "Missing
          #     expected rejection / expected /exit code: 37/" (~36% of runs,
          #     main included).
          #   * `--mount-host` alone was never exercised by CI and fails
          #     deterministically with `non_json_value` from the harness
          #     `canonical()` serializer during turn 1.
          # The contracts this proof covers (real exit 37, cold Session resume,
          # durable approval, turn ownership) stay covered deterministically by
          # verify-native-owned-recovery.mjs and verify-native-durable-approval
          # above. Tracked in the follow-up issue for the external-turn flake.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-dsh-host-${{ matrix.os }}
          path: |
            .artifacts/patched-host-acceptance.json
            .artifacts/patched-host/host-tests.json
            .artifacts/patched-host/host-dependency-lifecycle.json
            .artifacts/frozen-host.json
            .artifacts/native-host-contracts.log
          if-no-files-found: error
          retention-days: 7
