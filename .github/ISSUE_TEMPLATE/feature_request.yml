name: Feature request
description: Describe a problem Studio could help solve
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the result and any relevant runtime or platform.
    validations:
      required: true
