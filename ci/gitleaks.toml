title = "AgentKit Studio secret gate"

[extend]
useDefault = true

# No file, commit, fingerprint or real-secret exemptions. These exact values
# are public synthetic redaction fixtures or a JavaScript variable reference,
# not credentials. Other values, even in the same file, remain scanned.
[[allowlists]]
description = "Exact synthetic fixtures and nonliteral configuration expression"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^(?:abc123def456|sk-xyz987ghi|private-skills-e2b-key|fixed\.KS3_SECRET_KEY)$''',
]
